name: Bug report
description: Something compiles or runs differently from what the documentation says, or the toolchain crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A crash (not a diagnostic) in any tool is always a bug worth reporting, even without a minimal program.
        For anything security-relevant, use the private channel described in SECURITY.md instead of this form.
  - type: input
    id: version
    attributes:
      label: Tacqor version
      description: Output of `tacqor --version`
      placeholder: Tacqor 1.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 x64 / macOS 15 arm64 / Windows 11 (WSL)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options: ["VM (tacqor run / tacqor file.tq)", "Portable bytecode (.tqb)", "Embedded executable (tacqor build)", "Native (tacqor build --native)", "Compile time only (check / diagnose / test)", "REPL", "Package manager", "VS Code extension"]
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Smallest program that shows the problem
      render: text
      placeholder: |
        def main():
            print(1 + 1)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and full output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: Point at the document that says so, if there is one (LANGUAGE.md, STDLIB.md, docs/SPECIFICATION.md).
