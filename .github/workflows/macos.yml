name: macOS

# GitHub's hosted macOS runners are capacity-limited and are regularly refused for this organization
# ("The job was not acquired by Runner"), which marks the run failed and emails the owner. So the macOS
# build runs only when it matters — on release tags (to attach the macOS binary) and on demand — not on
# every push or on a schedule. Clang portability is covered day to day by the Linux Clang job in CI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS arm64 (Clang) — build, suite, release asset on tags
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: make -j3
      - run: make test
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          tar -czf "tacqor-${TAG}-macos-arm64.tar.gz" tacqor
          for i in 1 2 3 4 5 6; do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" "tacqor-${TAG}-macos-arm64.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
